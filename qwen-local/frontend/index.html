<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <title>法律小助手· 本地法律智能助手</title>
    <link rel="stylesheet" href="/courts.css?v=20261010-roles">

    <style>
        :root {
            --bg: #f5f7fb;
            --surface: rgba(255, 255, 255, 0.88);
            --surface-solid: #ffffff;
            --sidebar: #111827;
            --sidebar-hover: #202a3b;
            --primary: #315ee7;
            --primary-dark: #2449bd;
            --text: #192235;
            --muted: #748095;
            --line: #e3e8f2;
            --assistant: #ffffff;
            --user: linear-gradient(
                135deg,
                #315ee7,
                #694bd7
            );
            --shadow: 0 18px 50px
                rgba(31, 47, 85, 0.09);
        }

        * {
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            margin: 0;
            overflow: hidden;
            color: var(--text);
            font-family:
                Inter,
                "Microsoft YaHei",
                system-ui,
                sans-serif;
            background:
                radial-gradient(
                    circle at 80% 10%,
                    #e7eaff,
                    transparent 28%
                ),
                var(--bg);
        }

        button,
        textarea {
            font: inherit;
        }

        .app {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 286px;
            display: flex;
            flex-shrink: 0;
            flex-direction: column;
            padding: 22px 16px;
            color: #f8fafc;
            background:
                linear-gradient(
                    180deg,
                    #111827,
                    #0b1120
                );
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 8px 20px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            border-radius: 13px;
            font-size: 21px;
            background:
                linear-gradient(
                    135deg,
                    #5b7cfa,
                    #8c5ce9
                );
            box-shadow:
                0 10px 30px
                rgba(91, 124, 250, 0.35);
        }

        .brand-name {
            font-size: 18px;
            font-weight: 750;
        }

        .brand-subtitle {
            margin-top: 3px;
            color: #94a3b8;
            font-size: 11px;
        }

        .new-chat {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid
                rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: white;
            cursor: pointer;
            background:
                linear-gradient(
                    135deg,
                    #315ee7,
                    #654bc7
                );
            box-shadow:
                0 8px 22px
                rgba(49, 94, 231, 0.22);
            transition: 0.2s ease;
        }

        .new-chat:hover {
            transform: translateY(-1px);
            filter: brightness(1.08);
        }

        .sidebar-label {
            margin: 24px 8px 10px;
            color: #64748b;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.12em;
        }

        .conversation-list {
            flex: 1;
            overflow-y: auto;
        }

        .conversation-list::-webkit-scrollbar {
            width: 5px;
        }

        .conversation-list::-webkit-scrollbar-thumb {
            border-radius: 8px;
            background: #334155;
        }

        .conversation {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
            padding: 11px 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .conversation:hover {
            background: var(--sidebar-hover);
        }

        .conversation.active {
            background: #28344a;
        }

        .conversation-icon {
            color: #94a3b8;
            font-size: 14px;
        }

        .conversation-title {
            min-width: 0;
            flex: 1;
            overflow: hidden;
            font-size: 13px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .delete {
            padding: 4px 6px;
            border: 0;
            color: #718096;
            cursor: pointer;
            opacity: 0;
            background: transparent;
        }

        .conversation:hover .delete {
            opacity: 1;
        }

        .delete:hover {
            color: #fb7185;
        }

        .sidebar-footer {
            padding: 14px 8px 2px;
            border-top: 1px solid #1e293b;
            color: #64748b;
            font-size: 11px;
            line-height: 1.7;
        }

        .main {
            min-width: 0;
            display: flex;
            flex: 1;
            flex-direction: column;
        }

        .header {
            height: 74px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            border-bottom: 1px solid
                rgba(227, 232, 242, 0.9);
            backdrop-filter: blur(18px);
            background: rgba(255, 255, 255, 0.7);
        }

        .header-title {
            overflow: hidden;
            font-weight: 720;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .model-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 11px;
            border: 1px solid #dce4f1;
            border-radius: 999px;
            color: #526079;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.8);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow:
                0 0 0 4px
                rgba(34, 197, 94, 0.12);
        }

        .messages {
            flex: 1;
            padding: 30px 22px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .welcome {
            max-width: 760px;
            margin: 8vh auto 0;
            text-align: center;
        }

        .welcome-icon {
            width: 74px;
            height: 74px;
            display: grid;
            place-items: center;
            margin: 0 auto 22px;
            border-radius: 22px;
            color: white;
            font-size: 34px;
            background: var(--user);
            box-shadow:
                0 18px 45px
                rgba(74, 78, 211, 0.25);
        }

        .welcome h1 {
            margin: 0;
            font-size: 30px;
        }

        .welcome p {
            margin: 12px 0 28px;
            color: var(--muted);
            line-height: 1.7;
        }

        .suggestions {
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .suggestion {
            padding: 16px;
            border: 1px solid var(--line);
            border-radius: 14px;
            color: #4a5870;
            text-align: left;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.76);
            transition: 0.2s;
        }

        .suggestion:hover {
            border-color: #aebcf3;
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .message {
            max-width: 880px;
            display: flex;
            gap: 13px;
            margin: 0 auto 24px;
            animation: appear 0.22s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(5px);
            }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 35px;
            height: 35px;
            display: grid;
            flex-shrink: 0;
            place-items: center;
            border-radius: 11px;
            color: white;
            font-size: 14px;
            font-weight: 700;
            background: #1e293b;
        }

        .message.assistant .avatar {
            background:
                linear-gradient(
                    135deg,
                    #315ee7,
                    #754ed1
                );
        }

        .message-body {
            max-width: min(75%, 720px);
        }

        .message-name {
            margin: 0 3px 7px;
            color: var(--muted);
            font-size: 12px;
        }

        .message.user .message-name {
            text-align: right;
        }

        .message-content {
            padding: 14px 17px;
            border: 1px solid var(--line);
            border-radius: 5px 17px 17px 17px;
            line-height: 1.75;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            background: var(--assistant);
            box-shadow:
                0 5px 20px
                rgba(31, 47, 85, 0.05);
        }

        .message.user .message-content {
            border: 0;
            border-radius: 17px 5px 17px 17px;
            color: white;
            background: var(--user);
        }

        .message-content.markdown-body { white-space: normal; }
        .markdown-body > :first-child { margin-top: 0; }
        .markdown-body > :last-child { margin-bottom: 0; }
        .markdown-body p { margin: 0 0 0.85em; }
        .markdown-body strong { font-weight: 700; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3,
        .markdown-body h4, .markdown-body h5, .markdown-body h6 {
            margin: 1.2em 0 0.5em;
            line-height: 1.4;
        }
        .markdown-body h1 { font-size: 1.4em; }
        .markdown-body h2 { font-size: 1.25em; }
        .markdown-body h3 { font-size: 1.1em; }
        .markdown-body ul, .markdown-body ol { margin: 0.65em 0; padding-left: 1.7em; }
        .markdown-body li { margin: 0.3em 0; }
        .markdown-body li > p { margin: 0.3em 0; }
        .markdown-body blockquote {
            margin: 0.8em 0;
            padding: 0.3em 0.9em;
            border-left: 3px solid #aebcf3;
            color: #596579;
            background: #f5f7fb;
        }
        .markdown-body blockquote > :last-child { margin-bottom: 0; }
        .markdown-body code {
            padding: 0.15em 0.35em;
            border-radius: 4px;
            background: #eef1f7;
            font-family: Consolas, monospace;
            font-size: 0.9em;
        }
        .markdown-body pre {
            margin: 0.8em 0;
            padding: 12px 14px;
            overflow-x: auto;
            border-radius: 8px;
            background: #f3f5f9;
            white-space: pre;
        }
        .markdown-body pre code { padding: 0; background: none; }
        .markdown-body a { color: var(--primary); text-decoration: underline; }
        .markdown-body hr { margin: 1em 0; border: 0; border-top: 1px solid var(--line); }
        .markdown-body .markdown-table { overflow-x: auto; margin: 0.8em 0; }
        .markdown-body table { width: 100%; border-collapse: collapse; font-size: 0.95em; }
        .markdown-body th, .markdown-body td { padding: 7px 10px; border: 1px solid var(--line); }
        .markdown-body th { background: #f3f5f9; text-align: left; }
        .generation-metrics { margin-top: 12px; font-size: 12px; color: #64748b; line-height: 1.8; overflow-wrap: anywhere; }
        .generation-warning { color: #b45309; }

        .streaming::after {
            content: "";
            width: 7px;
            height: 17px;
            display: inline-block;
            margin-left: 3px;
            vertical-align: -3px;
            background: #315ee7;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        .composer-area {
            padding: 16px 24px 22px;
            border-top: 1px solid
                rgba(227, 232, 242, 0.9);
            background: rgba(245, 247, 251, 0.84);
            backdrop-filter: blur(16px);
        }

        .model-controls { max-width: 880px; margin: 0 auto 10px; position: relative; }
        .model-controls summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; width: fit-content; padding: 8px 12px; border-radius: 12px; color: #34415c; font-size: 13px; }
        .model-controls summary:hover { background: #e8edf7; }
        .model-controls summary::-webkit-details-marker { display: none; }
        .model-controls summary span { color: #6b7890; }
        .model-controls summary { width: 100%; box-sizing: border-box; }
        .model-controls summary .model-name { color: #34415c; min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #thinkingLabel { white-space: nowrap; flex-shrink: 0; }
        .model-settings-panel { position: absolute; bottom: calc(100% + 8px); left: 0; z-index: 20; width: min(340px, 100%); padding: 18px; background: white; border: 1px solid #d9e0ec; border-radius: 16px; box-shadow: 0 10px 36px #20335724; }
        .model-settings-panel label { display: block; font-size: 14px; margin-bottom: 8px; }
        .thinking-options { display: flex; gap: 4px; padding: 4px; background: #f0f3f9; border-radius: 10px; margin-bottom: 18px; }
        .thinking-options button { flex: 1; padding: 8px 0; border: none; border-radius: 7px; background: transparent; color: #596780; cursor: pointer; }
        .thinking-options button[aria-pressed="true"] { background: #315efb; color: white; }
        .variety-labels { display: flex; justify-content: space-between; font-size: 12px; color: #748097; margin-bottom: 14px; }
        .temperature-track { position: relative; padding-top: 22px; }
        #temperatureSlider { width: 100%; margin: 0; accent-color: #315efb; }
        #temperatureValue { position: absolute; top: 0; transform: translateX(-50%); font-size: 11px; color: #315efb; background: #edf2ff; border-radius: 5px; padding: 1px 4px; pointer-events: none; }
        .thinking-preview { font-size: 12px; line-height: 1.7; color: #8390a4; white-space: pre-wrap; max-height: 180px; overflow: auto; margin-bottom: 8px; }
        .settings-help { color: #748097; font-size: 12px; line-height: 1.6; margin: 8px 0 0; }

        .composer {
            max-width: 880px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            margin: auto;
            padding: 9px 9px 9px 16px;
            border: 1px solid #d9e0ec;
            border-radius: 17px;
            background: white;
            box-shadow: var(--shadow);
        }

        textarea {
            min-height: 44px;
            max-height: 160px;
            flex: 1;
            padding: 11px 0;
            border: 0;
            outline: none;
            resize: none;
            color: var(--text);
            line-height: 1.5;
            background: transparent;
        }

        .send {
            width: 46px;
            height: 46px;
            display: grid;
            flex-shrink: 0;
            place-items: center;
            border: 0;
            border-radius: 13px;
            color: white;
            cursor: pointer;
            font-size: 18px;
            background: var(--primary);
            transition: 0.2s;
        }

        .send:hover {
            background: var(--primary-dark);
        }

        .send:disabled {
            cursor: wait;
            opacity: 0.5;
        }

        .disclaimer {
            margin-top: 9px;
            color: #9aa5b6;
            font-size: 11px;
            text-align: center;
        }

        @media (max-width: 760px) {
            .sidebar {
                width: 220px;
            }

            .header {
                padding: 0 16px;
            }

            .model-status {
                display: none;
            }

            .suggestions {
                grid-template-columns: 1fr;
            }

            .message-body {
                max-width: 85%;
            }
        }
        @media (max-width: 480px) {
            .app { flex-direction: column; }
            .sidebar { width: 100%; padding: 8px; max-height: 130px; }
            .brand, .sidebar-label, .sidebar-footer { display: none; }
            .new-chat { padding: 7px; }
            .conversation-list { margin-top: 6px; min-height: 0; overflow-y: auto; }
            .main { min-height: 0; min-width: 0; }
            .messages { padding: 16px 10px; }
            .message { gap: 8px; }
            .message-body { min-width: 0; max-width: calc(100% - 43px); }
            .message-content { padding: 10px; font-size: 14px; }
            .composer { padding: 10px; }
        }

        .auth-overlay { position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; padding:24px; overflow:auto; background:radial-gradient(ellipse at 15% 20%,#e3eaff 0,transparent 45%),radial-gradient(ellipse at 85% 85%,#ece5ff 0,transparent 45%),var(--bg); }
        .auth-overlay::before { content:''; position:absolute; inset:0; pointer-events:none; background-image:radial-gradient(#315ee716 1px,transparent 1px); background-size:24px 24px; mask-image:linear-gradient(transparent,#000,transparent); }
        .auth-card { position:relative; width:100%; max-width:430px; padding:36px; border:1px solid #fff; border-radius:28px; background:rgba(255,255,255,.9); box-shadow:0 24px 80px #31447914; backdrop-filter:blur(18px); animation:auth-enter .45s ease-out both; }
        .auth-brand { display:flex; align-items:center; gap:12px; margin-bottom:30px; }
        .auth-brand .brand-icon { flex-shrink:0; }
        .auth-brand strong { display:block; font-size:17px; }
        .auth-brand small { display:block; margin-top:4px; color:var(--muted); font-size:12px; letter-spacing:1px; }
        .auth-card h2 { font-size:27px; letter-spacing:-.7px; margin:0 0 10px; }
        .auth-intro { color:var(--muted); font-size:14px; line-height:1.7; margin:0 0 26px; }
        .auth-label { display:block; font-size:13px; font-weight:600; margin-top:18px; }
        .auth-input { display:block; width:100%; margin-top:9px; padding:13px 15px; border:1px solid var(--line); border-radius:13px; background:#f8faff; color:var(--text); font:inherit; font-size:14px; outline:none; transition:border-color .2s,box-shadow .2s,background .2s; }
        .auth-input:hover { border-color:#bdc9ef; }
        .auth-input:focus { background:#fff; border-color:var(--primary); box-shadow:0 0 0 4px #315ee711; }
        .auth-error { color:#b91c1c; font-size:13px; line-height:1.5; margin:12px 0; }
        .auth-error:empty { margin:18px 0 0; }
        .auth-submit { width:100%; margin-top:10px; padding:14px; border:0; border-radius:13px; color:#fff; background:var(--user); font-weight:600; cursor:pointer; box-shadow:0 7px 20px #315ee725; transition:transform .2s,box-shadow .2s; }
        .auth-submit:hover { transform:translateY(-2px); box-shadow:0 10px 26px #315ee738; }
        .auth-submit:active { transform:translateY(0); }
        .auth-submit:disabled { opacity:.65; cursor:wait; transform:none; }
        .auth-switch { display:block; margin:18px auto 0; padding:7px 10px; border:0; background:transparent; color:var(--primary); font-size:13px; cursor:pointer; border-radius:8px; transition:background .2s; }
        .auth-switch:hover { background:#315ee709; }
        .auth-note { border-top:1px solid var(--line); margin:24px 0 0; padding-top:18px; font-size:12px; color:var(--muted); line-height:1.8; }
        .auth-footer { display:flex; justify-content:center; gap:7px; align-items:center; color:var(--muted); font-size:12px; margin-top:20px; }
        .auth-footer span { width:6px; height:6px; background:#7894ea; border-radius:50%; }
        #logoutButton { border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--muted); padding:5px 9px; cursor:pointer; font-size:12px; }
        @keyframes auth-enter { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
        @media(max-width:480px) { .auth-overlay { padding:18px; } .auth-card { padding:27px 24px; border-radius:22px; } .auth-card h2 { font-size:24px; } }
        @media(prefers-reduced-motion:reduce) { .auth-card { animation:none; } .auth-submit,.auth-input,.auth-switch { transition:none; } }
    </style>
</head>

<body>
<div id="authOverlay" class="auth-overlay">
<form id="authForm" class="auth-card">
<div class="auth-brand"><div class="brand-icon" aria-hidden="true">⚖</div><div><strong>法律小助手</strong><small>你的法律问答空间</small></div></div>
<h2 id="authTitle">欢迎回来</h2>
<p class="auth-intro" id="authIntro">登录你的账号，继续上一次的思考。</p>
<label class="auth-label">用户名<input class="auth-input" id="authUsername" autocomplete="username" placeholder="输入用户名" pattern="[a-zA-Z0-9_]{3,32}" minlength="3" maxlength="32" required></label>
<label class="auth-label">密码<input class="auth-input" id="authPassword" type="password" autocomplete="current-password" placeholder="输入密码，至少 8 位" minlength="8" maxlength="128" required></label>
<p id="authError" class="auth-error" role="alert"></p>
<button id="authSubmit" class="auth-submit" type="submit">登录</button>
<button id="authSwitch" class="auth-switch" type="button">还没有账号？创建一个</button>
<p class="auth-note">用户名支持 3–32 位字母、数字或下划线。<br>每个账号拥有独立的聊天记录。</p>
<div class="auth-footer"><span></span>本地模型 · 独立会话</div>
</form></div>

<div class="app">
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-icon">⚖</div>
            <div>
                <div class="brand-name">小助手</div>
                <div class="brand-subtitle">
                    本地法律智能助手
                </div>
            </div>
        </div>

        <button id="newChat" class="new-chat">
            ＋ 开始新对话
        </button>

        <div class="sidebar-label">
            历史对话
        </div>

        <div
            id="conversationList"
            class="conversation-list"
        ></div>

        <div class="sidebar-footer">
            <span id="modelName">本地模型</span> · 本地推理<br>
            数据仅保存在本机
        </div>
    </aside>

    <main class="main">
        <header class="header">
            <div
                id="headerTitle"
                class="header-title"
            >
                新对话
            </div>

            <div class="model-status"><span id="currentUser"></span><button id="logoutButton" type="button">退出登录</button>
                <span class="status-dot"></span>
                <span id="modelStatusText">正在检查模型状态</span>
            </div>
        </header>

        <section
            id="messages"
            class="messages"
        ></section>

        <div class="composer-area">
            <details class="model-controls" id="modelControls">
                <summary><span class="model-name" title="当前模型：Qwen3.8-Flash-Next">✦ 当前模型：<strong id="modelLabel">Qwen3.8-Flash-Next</strong></span> <span id="thinkingLabel">关闭思考</span> ▾</summary>
                <div class="model-settings-panel">
                    <label>思考模式</label>
                    <div class="thinking-options" role="group" aria-label="思考模式">
                        <button type="button" data-effort="none" aria-pressed="true">关闭</button>
                        <button type="button" data-effort="low" aria-pressed="false">低</button>
                        <button type="button" data-effort="medium" aria-pressed="false">中</button>
                        <button type="button" data-effort="high" aria-pressed="false">高</button>
                    </div>
                    <div class="variety-labels"><span>更稳定</span><span>更多样</span></div>
                    <div class="temperature-track">
                        <output id="temperatureValue">0.7</output>
                        <input id="temperatureSlider" aria-label="回答多样性" type="range" min="0" max="3" step="1" value="2">
                    </div>
                </div>
            </details>
            <form id="chatForm" class="composer">
                <textarea
                    id="messageInput"
                    rows="1"
                    placeholder="描述你的法律问题……"
                ></textarea>

                <button
                    id="sendButton"
                    class="send"
                    type="submit"
                    title="发送"
                >
                    ↑
                </button>
            </form>

            <div class="disclaimer">
                AI 回答仅供系统测试，不构成正式法律意见
            </div>
        </div>
    </main>
</div>

<script src="/vendor/marked.umd.js"></script>
<script src="/vendor/purify.min.js"></script>
<script>
    let conversations = [];
    let currentConversationId = null;
    let isGenerating = false;
    const effortLabels = {none: '关闭思考', low: '低思考', medium: '中思考', high: '高思考'};
    const temperatureLevels = [0.2, 0.4, 0.7, 1.0];
    let generationSettings = {reasoning_effort: 'none', temperature: 0.7};
    try {
        const saved = JSON.parse(localStorage.getItem('qwenGenerationSettings'));
        if (saved && saved.reasoning_effort in effortLabels && Number.isFinite(saved.temperature) && saved.temperature >= 0 && saved.temperature <= 1.5) generationSettings = saved;
    } catch (_) {}
    window.getGenerationSettings = () => ({reasoning_effort: generationSettings.reasoning_effort, temperature: generationSettings.temperature});
    function updateGenerationSettings() {
        const level = temperatureLevels.reduce((best, value, index) => Math.abs(value-generationSettings.temperature) < Math.abs(temperatureLevels[best]-generationSettings.temperature) ? index : best, 0);
        generationSettings.temperature = temperatureLevels[level];
        document.getElementById('thinkingLabel').textContent = effortLabels[generationSettings.reasoning_effort];
        document.getElementById('temperatureValue').textContent = generationSettings.temperature.toFixed(1);
        document.getElementById('temperatureValue').style.left = `calc(8px + (100% - 16px) * ${level / 3})`;
        document.getElementById('temperatureSlider').value = level;
        document.querySelectorAll('[data-effort]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.effort === generationSettings.reasoning_effort)));
        try { localStorage.setItem('qwenGenerationSettings', JSON.stringify(window.getGenerationSettings())); } catch (_) {}
    }
    document.querySelectorAll('[data-effort]').forEach(button => button.onclick = () => {generationSettings.reasoning_effort = button.dataset.effort; updateGenerationSettings();});
    document.getElementById('temperatureSlider').oninput = event => {generationSettings.temperature = temperatureLevels[Number(event.target.value)]; updateGenerationSettings();};
    document.addEventListener('click', event => {const menu = document.getElementById('modelControls'); if (!menu.contains(event.target)) menu.open = false;});
    updateGenerationSettings();

    const conversationList =
        document.getElementById("conversationList");

    const messagesElement =
        document.getElementById("messages");

    const headerTitle =
        document.getElementById("headerTitle");

    const messageInput =
        document.getElementById("messageInput");

    const sendButton =
        document.getElementById("sendButton");


    async function requestJson(url, options = {}) {
        const response = await fetch(url, {
            headers: {
                "Content-Type": "application/json",
                ...(options.headers || {}),
            },
            ...options,
        });

        if (response.status === 401) showLogin();
        if (!response.ok) {
            const data = await response.json()
                .catch(() => ({}));

            throw new Error(
                data.detail || "请求失败"
            );
        }

        return response.json();
    }


    function showWelcome() {
        headerTitle.textContent = "新对话";

        messagesElement.innerHTML = `
            <div class="welcome">
                <div class="welcome-icon">⚖</div>
                <h1>有什么法律问题需要了解？</h1>
                <p>
                    模型在你的电脑上本地运行，
                    聊天记录保存在 PostgreSQL 中，仅当前账号可访问。
                </p>

                <div class="suggestions">
                    <button class="suggestion">
                        房东拒绝退还押金应该怎么办？
                    </button>
                    <button class="suggestion">
                        劳动合同到期不续签有补偿吗？
                    </button>
                    <button class="suggestion">
                        网络购物发生纠纷如何维权？
                    </button>
                    <button class="suggestion">
                        借款只有转账记录能否起诉？
                    </button>
                </div>
            </div>
        `;

        document
            .querySelectorAll(".suggestion")
            .forEach(button => {
                button.addEventListener(
                    "click",
                    () => {
                        messageInput.value =
                            button.textContent.trim();

                        resizeInput();
                        messageInput.focus();
                    }
                );
            });
    }


    async function loadConversations(
        selectFirst = true
    ) {
        conversations = await requestJson(
            "/api/conversations"
        );

        renderConversations();

        if (
            selectFirst &&
            currentConversationId === null &&
            conversations.length > 0
        ) {
            await selectConversation(
                conversations[0].id
            );
        }
    }


    function renderConversations() {
        conversationList.innerHTML = "";

        for (const conversation of conversations) {
            const row = document.createElement("div");
            row.className = "conversation";

            if (
                conversation.id
                === currentConversationId
            ) {
                row.classList.add("active");
            }

            const icon =
                document.createElement("span");

            icon.className = "conversation-icon";
            icon.textContent = "◇";

            const title =
                document.createElement("div");

            title.className = "conversation-title";
            title.textContent = conversation.title;

            const deleteButton =
                document.createElement("button");

            deleteButton.className = "delete";
            deleteButton.textContent = "×";
            deleteButton.title = "删除会话";

            row.addEventListener("click", () => {
                if (!isGenerating) {
                    selectConversation(
                        conversation.id
                    );
                }
            });

            deleteButton.addEventListener(
                "click",
                async event => {
                    event.stopPropagation();

                    if (isGenerating) {
                        return;
                    }

                    if (
                        !confirm("确定删除该会话吗？")
                    ) {
                        return;
                    }

                    await requestJson(
                        `/api/conversations/` +
                        conversation.id,
                        {
                            method: "DELETE",
                        }
                    );

                    if (
                        currentConversationId
                        === conversation.id
                    ) {
                        currentConversationId = null;
                        showWelcome();
                    }

                    await loadConversations();
                }
            );

            row.append(icon, title, deleteButton);
            conversationList.appendChild(row);
        }
    }


    async function createConversation() {
        const conversation = await requestJson(
            "/api/conversations",
            {
                method: "POST",
                body: JSON.stringify({}),
            }
        );

        currentConversationId = conversation.id;

        await loadConversations(false);
        await selectConversation(conversation.id);

        return conversation;
    }


    async function selectConversation(id) {
        currentConversationId = id;
        location.hash = 'chat/' + id;

        const conversation = conversations.find(
            item => item.id === id
        );

        headerTitle.textContent =
            conversation?.title || "对话";

        renderConversations();

        const messages = await requestJson(
            `/api/conversations/${id}/messages`
        );

        renderMessages(messages);
    }


    function renderMessages(messages) {
        messagesElement.innerHTML = "";

        if (messages.length === 0) {
            showWelcome();
            return;
        }

        for (const message of messages) {
            appendMessage(
                message.role,
                message.content
            );
        }

        scrollToBottom();
    }


    function renderMessageContent(element, content, role = "assistant") {
        if (role !== "assistant" || !window.marked || !window.DOMPurify) {
            element.classList.remove("markdown-body");
            element.textContent = content;
            return;
        }
        element.classList.add("markdown-body");
        const html = marked.parse(content, { gfm: true, breaks: true, async: false });
        element.innerHTML = DOMPurify.sanitize(html, {
            ALLOWED_TAGS: ["p", "br", "strong", "em", "del", "h1", "h2", "h3",
                "h4", "h5", "h6", "ul", "ol", "li", "blockquote", "pre", "code",
                "hr", "table", "thead", "tbody", "tr", "th", "td", "a", "sup", "sub"],
            ALLOWED_ATTR: ["href", "title", "start", "colspan", "rowspan"],
        });
        element.querySelectorAll("a").forEach(link => {
            link.target = "_blank";
            link.rel = "noopener noreferrer";
        });
        element.querySelectorAll("table").forEach(table => {
            const wrapper = document.createElement("div");
            wrapper.className = "markdown-table";
            table.replaceWith(wrapper);
            wrapper.appendChild(table);
        });
    }

    function appendMessage(
        role,
        content,
        streaming = false
    ) {
        const wrapper =
            document.createElement("article");

        wrapper.className = `message ${role}`;

        const avatar =
            document.createElement("div");

        avatar.className = "avatar";
        avatar.textContent =
            role === "user" ? "你" : "AI";

        const body =
            document.createElement("div");

        body.className = "message-body";

        const name =
            document.createElement("div");

        name.className = "message-name";
        name.textContent =
            role === "user"
                ? "你"
                : "小助手 法律助手";

        const contentElement =
            document.createElement("div");

        contentElement.className =
            "message-content";

        if (streaming) {
            contentElement.classList.add(
                "streaming"
            );
        }

        renderMessageContent(contentElement, content, role);

        body.append(name, contentElement);
        wrapper.append(avatar, body);
        messagesElement.appendChild(wrapper);

        scrollToBottom();

        return {
            wrapper,
            contentElement,
        };
    }


    function scrollToBottom() {
        messagesElement.scrollTop =
            messagesElement.scrollHeight;
    }


    function resizeInput() {
        messageInput.style.height = "auto";

        messageInput.style.height =
            Math.min(
                messageInput.scrollHeight,
                160
            ) + "px";
    }

    function showGenerationMetrics(assistant, metrics) {
        if (!metrics) return;
        const panel = document.createElement("div");
        panel.className = "generation-metrics";
        const format = key => metrics[key] == null ? "—" : Number(metrics[key]).toFixed(2);
        panel.textContent = `输入 ${metrics.input_tokens} · 输出 ${metrics.output_tokens} tokens · ` +
            `首 token ${format("request_ttft_seconds")}s · ${format("tokens_per_second")} token/s · ` +
            `生成 ${format("generation_seconds")}s · 服务端总耗时 ${format("end_to_end_seconds")}s · ` +
            `整卡显存 ${format("gpu_used_gib")}/${format("gpu_total_gib")} GiB (${format("gpu_used_percent")}%) · ` +
            `峰值分配 ${format("peak_allocated_gib")} GiB / 保留 ${format("peak_reserved_gib")} GiB`;
        if (metrics.metrics_source === 'vllm_proxy') {
            panel.textContent = `输入 ${metrics.input_tokens} · 输出 ${metrics.output_tokens} tokens · 首文本 ${format("request_ttft_seconds")}s · 平均吞吐 ${format("tokens_per_second")} token/s · 服务端总耗时 ${format("end_to_end_seconds")}s`;
        }
        panel.title = "首 token 包含服务端排队；生成速度按输出 token / 上游总耗时计算，包含首 token 等待。输出 token 按推理服务统计。";
        if (metrics.finish_reason === "length") {
            const warning = document.createElement("div");
            warning.className = "generation-warning";
            warning.textContent = `已达到 ${metrics.max_new_tokens} tokens 输出上限，回答可能尚未写完。可以发送“继续”，或提高输出预算。`;
            panel.appendChild(warning);
        }
        assistant.contentElement.parentElement.appendChild(panel);
        scrollToBottom();
    }


    async function sendStreamingMessage(content) {
        const submittedSettings = window.getGenerationSettings();
        if (currentConversationId === null) {
            await createConversation();
        }

        if (
            messagesElement.querySelector(".welcome")
        ) {
            messagesElement.innerHTML = "";
        }

        appendMessage("user", content);

        const assistant = appendMessage(
            "assistant",
            "",
            true
        );
        const thinkingPreview = document.createElement('div');
        thinkingPreview.className = 'thinking-preview';
        thinkingPreview.hidden = true;
        assistant.contentElement.before(thinkingPreview);

        const response = await fetch(
            `/api/conversations/` +
            `${currentConversationId}/messages/stream`,
            {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/json",
                },
                body: JSON.stringify({
                    content: content,
                    generation: submittedSettings,
                }),
            }
        );

        if (response.status === 401) showLogin();
        if (!response.ok) {
            const data = await response.json()
                .catch(() => ({}));

            throw new Error(
                data.detail || "请求失败"
            );
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");

        let buffer = "";
        let completeText = "";
        let completed = false;

        while (true) {
            const { value, done } =
                await reader.read();

            buffer += decoder.decode(
                value || new Uint8Array(),
                { stream: !done }
            );

            let boundary;

            while (
                (boundary = buffer.indexOf("\n\n"))
                !== -1
            ) {
                const rawEvent =
                    buffer.slice(0, boundary);

                buffer =
                    buffer.slice(boundary + 2);

                const dataLine = rawEvent
                    .split("\n")
                    .find(line =>
                        line.startsWith("data:")
                    );

                if (!dataLine) {
                    continue;
                }

                const event = JSON.parse(
                    dataLine.slice(5).trim()
                );

                if (event.type === 'queued') {
                    headerTitle.textContent = `等待生成 · 队列第 ${event.position} 位`;
                }
                if (event.type === 'generating') {
                    headerTitle.textContent = '模型处理中 · 等待回答…';
                }
                if (event.type === 'reasoning') {
                    thinkingPreview.hidden = false;
                    thinkingPreview.textContent += event.content;
                    thinkingPreview.scrollTop = thinkingPreview.scrollHeight;
                    headerTitle.textContent = '正在思考…';
                    scrollToBottom();
                }
                if (event.type === "error") thinkingPreview.remove();
                if (event.type === "delta") {
                    thinkingPreview.remove();
                    completeText += event.content;

                    renderMessageContent(assistant.contentElement, completeText);

                    scrollToBottom();
                }

                if (event.type === "done") {
                    thinkingPreview.remove();
                    completed = true;
                    renderMessageContent(assistant.contentElement, event.assistant_message.content);
                    showGenerationMetrics(assistant, event.metrics);

                    assistant.contentElement
                        .classList.remove("streaming");

                    headerTitle.textContent =
                        event.conversation.title;

                    await loadConversations(false);
                }

                if (event.type === "error") {
                    throw new Error(event.message);
                }
            }

            if (done) {
                break;
            }
        }

        assistant.contentElement
            .classList.remove("streaming");

        if (!completed) {
            throw new Error(completeText ? "连接提前结束，回答可能不完整，请重试或发送“继续”。" : "没有收到模型输出。");
        }
    }


    document
        .getElementById("chatForm")
        .addEventListener(
            "submit",
            async event => {
                event.preventDefault();

                if (isGenerating) {
                    return;
                }

                const content =
                    messageInput.value.trim();

                if (!content) {
                    return;
                }

                messageInput.value = "";
                resizeInput();

                isGenerating = true;
                sendButton.disabled = true;
                sendButton.textContent = "…";

                try {
                    await sendStreamingMessage(content);
                } catch (error) {
                    appendMessage(
                        "assistant",
                        `请求失败：${error.message}`
                    );
                } finally {
                    isGenerating = false;
                    sendButton.disabled = false;
                    sendButton.textContent = "↑";
                    messageInput.focus();
                }
            }
        );


    messageInput.addEventListener(
        "input",
        resizeInput
    );


    messageInput.addEventListener(
        "keydown",
        event => {
            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {
                event.preventDefault();

                document
                    .getElementById("chatForm")
                    .requestSubmit();
            }
        }
    );


    document
        .getElementById("newChat")
        .addEventListener(
            "click",
            async () => {
                if (!isGenerating) {
                    await createConversation();
                    messageInput.focus();
                }
            }
        );


    showWelcome();

    requestJson("/api/health").then(health => {
        document.getElementById("modelName").textContent = health.model;
        document.getElementById("modelStatusText").textContent =
            `${health.model} ${health.model_loaded ? "正常运行" : "尚未加载"}`;
    }).catch(() => {
        document.getElementById("modelStatusText").textContent = "模型服务连接失败";
    });

    let registerMode = false;
    function showLogin() {
        window.courtUI?.reset();
        document.getElementById('authOverlay').style.display = 'flex';
        document.getElementById('currentUser').textContent = '';
        conversations = []; currentConversationId = null;
        conversationList.innerHTML = ''; showWelcome();
    }
    async function signedIn(user) {
        const restoreHash = location.hash;
        document.getElementById('authOverlay').style.display = 'none';
        document.getElementById('currentUser').textContent = user.username;
        document.getElementById('authPassword').value = '';
        await loadConversations();
        location.hash = restoreHash;
        await window.courtUI?.signedIn(user);
    }
    document.getElementById('authSwitch').onclick = () => {
        registerMode = !registerMode;
        document.getElementById('authTitle').textContent = registerMode ? '开启你的问答空间' : '欢迎回来';
        document.getElementById('authSubmit').textContent = registerMode ? '注册并登录' : '登录';
        document.getElementById('authSwitch').textContent = registerMode ? '已有账号？返回登录' : '还没有账号？创建一个';
        document.getElementById('authIntro').textContent = registerMode ? '从一个问题开始，让复杂的事情更清晰。' : '登录你的账号，继续上一次的思考。';
        document.getElementById('authPassword').autocomplete = registerMode ? 'new-password' : 'current-password';
        document.getElementById('authError').textContent = '';
    };
    document.getElementById('authForm').onsubmit = async event => {
        event.preventDefault();
        const button = document.getElementById('authSubmit'); button.disabled = true;
        try {
            const user = await requestJson('/api/auth/' + (registerMode ? 'register' : 'login'), {
                method: 'POST', body: JSON.stringify({username: document.getElementById('authUsername').value, password: document.getElementById('authPassword').value})
            });
            await signedIn(user);
            document.getElementById('authError').textContent = '';
        } catch (error) { document.getElementById('authError').textContent = error.message; }
        finally { button.disabled = false; }
    };
    document.getElementById('logoutButton').onclick = async () => {
        if (isGenerating) { alert('请等待当前回答结束后退出'); return; }
        try { await requestJson('/api/auth/logout', {method: 'POST', body: '{}'}); showLogin(); }
        catch (error) { alert(error.message); }
    };
    requestJson('/api/auth/me').then(signedIn).catch(error => {
        showLogin();
        if (error.message !== '请先登录' && !error.message.includes('过期')) document.getElementById('authError').textContent = error.message;
    });
</script>
